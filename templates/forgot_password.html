<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password — ResuMatch</title>
<link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
<style>
body{background:linear-gradient(135deg,#eff6ff 0%,#f8f7f4 100%);}
.auth-page{min-height:100vh;}
.back-link{position:fixed;top:1.25rem;left:1.5rem;display:flex;align-items:center;gap:.4rem;
  color:var(--text2);font-size:.85rem;font-weight:500;}
.back-link:hover{color:var(--text);opacity:1;}
</style>
</head>
<body>
<a href="{{ url_for('login') }}" class="back-link">← Back to Login</a>

<div class="auth-page">
  <div class="auth-card" style="max-width:400px">
    <div class="auth-logo">
      <div class="logo-icon">🔑</div>
      <h2>Forgot Password</h2>
      <p>Enter your candidate email to receive an OTP</p>
    </div>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat,msg in msgs %}
      <div class="flash flash-{{ 'success' if cat=='success' else 'error' }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:.5rem">
        Send OTP →
      </button>
    </form>
  </div>
</div>
</body>
</html>
