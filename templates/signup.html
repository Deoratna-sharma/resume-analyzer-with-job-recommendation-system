<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign Up — ResuMatch</title>
<link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
<style>body{background:linear-gradient(135deg,#eff6ff 0%,#f8f7f4 100%);}
.back-link{position:fixed;top:1.25rem;left:1.5rem;display:flex;align-items:center;gap:.4rem;color:var(--text2);font-size:.85rem;font-weight:500;}
.back-link:hover{color:var(--text);opacity:1;}
</style>
</head>
<body>
<a href="{{ url_for('home') }}" class="back-link">← Back to home</a>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">✨</div>
      <h2>Create Account</h2>
      <p>Start your job matching journey today</p>
    </div>

    {% if error %}
    <div class="flash flash-error">⚠ {{ error }}</div>
    {% endif %}

    <div style="background:var(--accent-l);border:1px solid #bfdbfe;border-radius:9px;padding:.75rem 1rem;margin-bottom:1.25rem;font-size:.82rem;color:var(--accent);display:flex;align-items:center;gap:.5rem">
      👤 Registration is for <strong>Candidates only</strong>. Hiring team & admin accounts are managed internally.
    </div>

    <form method="POST">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="Rahul Sharma" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Minimum 6 characters" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:.25rem">Create Account →</button>
    </form>

    <div class="divider-text" style="margin:1.25rem 0"><span>or</span></div>
    <div style="text-align:center;font-size:.875rem;color:var(--text2)">
      Already have an account? <a href="{{ url_for('login') }}" style="font-weight:600">Sign in</a>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
