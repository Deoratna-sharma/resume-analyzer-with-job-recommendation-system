<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — ResuMatch</title>
<link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
<style>
body{background:linear-gradient(135deg,#eff6ff 0%,#f8f7f4 100%);}
.auth-page{min-height:100vh;}
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card" style="max-width:400px">
    <div class="auth-logo">
      <div class="logo-icon">🔐</div>
      <h2>Secure Account</h2>
      <p>Create a new password</p>
    </div>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat,msg in msgs %}
      <div class="flash flash-{{ 'success' if cat=='success' else 'error' }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:.5rem">
        Update Password
      </button>
    </form>
  </div>
</div>
</body>
</html>
